name: Build Samurai Client exe
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.12 }
      - name: Build client jar
        working-directory: client
        run: gradle build --no-daemon
      - name: Bundle jar
        shell: bash
        run: |
          mkdir -p launcher/bundled
          cp client/build/libs/samurai-client-*-*.jar launcher/bundled/
          rm -f launcher/bundled/*-sources.jar
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build exe
        working-directory: launcher
        run: |
          npm install
          npx electron-builder --win portable --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: SamuraiClient
          path: launcher/dist/SamuraiClient.exe
